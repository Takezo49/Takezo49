name: Update profile statistics

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_profile_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate live statistics cards
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_TIMEZONE: Asia/Kolkata
        run: python scripts/update_profile_stats.py

      - name: Publish updated statistics
        run: |
          if git diff --quiet -- assets/stats.svg assets/contribution-graph.svg README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contribution-graph.svg README.md
          git commit -m "chore: refresh profile statistics"
          git push
